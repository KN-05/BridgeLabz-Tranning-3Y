<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Threads - Product Catalog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bg-dark text-white text-center py-4">
  <h1 class="fw-bold mb-0">Urban Threads</h1>
  <p class="mb-0 text-white-50">Everyday essentials, thoughtfully made</p>
</header>

<main class="container py-5">
  <h2 class="text-center mb-5">New Arrivals</h2>

       col-6 gives 2 columns on mobile/tablet per requirement,
       col-lg-3 keeps 4 columns only on large screens -->
  <div class="row g-4">

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card product-card h-100 shadow-sm">

        <div class="card-body text-center">
          <h5 class="card-title">Denim Jacket</h5>
          <p class="card-text text-muted mb-2">$59.99</p>
          <button class="btn btn-dark btn-sm w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
