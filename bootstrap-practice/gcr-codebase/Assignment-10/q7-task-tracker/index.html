<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<header class="bg-dark text-white py-3 mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="h4 mb-0">My Tasks</h1>
    <!-- Badge counter for total pending tasks -->
    <span class="badge bg-warning text-dark fs-6">4 Pending</span>
  </div>
</header>

<main class="container pb-5">
  <ul class="list-group shadow-sm mb-4">

    <li class="list-group-item d-flex justify-content-between align-items-center">
      Finish Bootstrap assignment
      <span class="badge bg-danger rounded-pill">High</span>
    </li>

    <li class="list-group-item d-flex justify-content-between align-items-center">
      Review pull request for login page
      <span class="badge bg-danger rounded-pill">High</span>
    </li>

    <li class="list-group-item d-flex justify-content-between align-items-center">
      Update project README
      <span class="badge bg-warning text-dark rounded-pill">Medium</span>
    </li>

    <li class="list-group-item d-flex justify-content-between align-items-center">
      Reply to client feedback email
      <span class="badge bg-warning text-dark rounded-pill">Medium</span>
    </li>

    <li class="list-group-item d-flex justify-content-between align-items-center">
      Reorganize design assets folder
      <span class="badge bg-success rounded-pill">Low</span>
    </li>

    <li class="list-group-item d-flex justify-content-between align-items-center text-decoration-line-through text-muted">
      Set up Git repository
      <span class="badge bg-secondary rounded-pill">Done</span>
    </li>

  </ul>

  <!-- Completed button with embedded badge -->
  <button class="btn btn-outline-success">
    Completed <span class="badge bg-success ms-1">1</span>
  </button>

</main>

<footer class="text-center text-muted small pb-4">
  &copy; 2026 Task Tracker App
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
