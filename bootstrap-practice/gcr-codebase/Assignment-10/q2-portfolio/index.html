<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ananya Sharma - Portfolio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container text-center">

  <!-- Header: name + tagline -->
  <header class="pt-5 pb-3">
    <h1 class="fw-bold mb-1">Khush</h1>
    <p class="text-dark fs-5">Frontend Developer &amp; UI Enthusiast</p>
  </header>

  <!-- Profile image using img-fluid and rounded-circle -->
  <div class="mb-4">
    <img src="profile.png"
         alt="Profile photo of Khush"
         class="img-fluid rounded-circle border border-3 border-white shadow">
  </div>

  <!-- Spacing + text utilities -->
  <p class="mt-4 mb-3 px-3 px-md-0 text-center fw-normal">
    I build clean, responsive web interfaces with a focus on usability and detail.
    Currently exploring React and Bootstrap-based design systems.
  </p>

  <!-- Two buttons -->
  <div class="mb-5">
    <button class="btn btn-primary mt-4 mb-3 me-2 px-4">Hire Me</button>
    <button class="btn btn-outline-secondary mt-4 mb-3 px-4">Download CV</button>
  </div>

  <!-- Contact form section -->
  <section class="bg-white p-5 rounded-3 shadow-sm text-start mx-auto mb-5" style="max-width: 500px;">
    <h4 class="text-center fw-bold mb-4">Get In Touch</h4>
    <form>
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" placeholder="Your full name">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="3" placeholder="Say hello..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Send Message</button>
    </form>
  </section>

</div>

<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0 small">&copy; 2026 Ananya Sharma. Built with Bootstrap.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
