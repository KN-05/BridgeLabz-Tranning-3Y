<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Login</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h2>Login</h2>
  <form id="loginForm" novalidate>
    <label for="username">Username</label>
    <input type="text" id="username"><span class="error" id="usernameError"></span>

    <label for="password">Password</label>
    <input type="password" id="password"><span class="error" id="passwordError"></span>

    <button type="submit">Log in</button>
  </form>
  <p id="message" class="success"></p>
  <script src="q7.js"></script>
</body>
</html>
