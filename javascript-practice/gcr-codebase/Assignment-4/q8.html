<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Object Updater</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h2>Edit user</h2>
  <form id="userForm">
    <label for="name">Name</label>
    <input type="text" id="name">

    <label for="email">Email</label>
    <input type="email" id="email">

  <div id="display" class="box"></div>
  <script src="q8.js"></script>
</body>
</html>
