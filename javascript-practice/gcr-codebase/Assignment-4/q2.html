<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Student Registration</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h2>Student Registration</h2>
  <form id="studentForm" novalidate>
    <label for="name">Name</label>
    <input type="text" id="name"><span class="error" id="nameError"></span>

    <label for="email">Email</label>
    <input type="text" id="email"><span class="error" id="emailError"></span>

    <label for="phone">Phone</label>
    <input type="text" id="phone"><span class="error" id="phoneError"></span>

    <label for="password">Password</label>
    <input type="password" id="password"><span class="error" id="passwordError"></span>

    <button type="submit">Register</button>
  </form>
  <p id="result" class="success"></p>
  <script src="q2.js"></script>
</body>
</html>
