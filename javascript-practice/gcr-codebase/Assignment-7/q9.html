<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q9 - Form Submit Blocker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    input.invalid { border: 1px solid red; }
    .error { color: red; font-size: 13px; min-height: 16px; }
    button { margin-top: 14px; padding: 8px 18px; cursor: pointer; }
    #success { color: green; font-weight: bold; margin-top: 14px; }
  </style>
</head>
<body>
  <h2>Registration Form</h2>
  <!-- novalidate turns off the browser's own popups so we can show our errors -->
  <form id="myForm" novalidate>
    <label for="name">Name</label>
    <input type="text" id="name">
    <div class="error" id="nameError"></div>

    <label for="email">Email</label>
    <input type="text" id="email">
    <div class="error" id="emailError"></div>

    <label for="password">Password</label>
    <input type="password" id="password">
    <div class="error" id="passwordError"></div>

    <button type="submit">Submit</button>
  </form>
  <div id="success"></div>
  <script src="q9.js"></script>
</body>
</html>
