<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q8 - Custom Dropdown</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .dropdown { position: relative; display: inline-block; }
    #dropBtn { width: 180px; padding: 8px; text-align: left; cursor: pointer; }
    #options { display: none; position: absolute; top: 100%; left: 0; width: 180px;
               list-style: none; margin: 2px 0 0; padding: 0; background: #fff;
               border: 1px solid #aaa; }
    #options.open { display: block; }
    #options li { padding: 8px; cursor: pointer; }
    #options li:hover { background: #e6f0ff; }
  </style>
</head>
<body>
  <h2>Custom Dropdown</h2>
  <div class="dropdown" id="dropdown">
    <button id="dropBtn">Select a language</button>
    <ul id="options">
      <li>JavaScript</li>
      <li>Python</li>
      <li>Java</li>
      <li>C++</li>
    </ul>
  </div>
  <script src="q8.js"></script>
</body>
</html>
