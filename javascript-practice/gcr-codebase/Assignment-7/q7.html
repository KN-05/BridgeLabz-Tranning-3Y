<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q7 - Mouse Logger</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    #box { position: relative; width: 400px; height: 400px; border: 2px solid #333;
           background: #f9f9f9; overflow: hidden; }
    .dot { position: absolute; width: 10px; height: 10px; background: red;
           border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  </style>
</head>
<body>
  <h2>Mouse Path &amp; Coordinates Logger</h2>
  <p id="coords">clientX: -, clientY: -</p>
  <div id="box"></div>
  <p>Move the mouse inside the box. Double-click to drop a red dot.</p>
  <script src="q7.js"></script>
</body>
</html>
