<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q3 - Multi-Step Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
    .step { display: none; }
    .step.active { display: block; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin: 8px 0; }
    .error { color: red; font-size: 14px; min-height: 18px; }
    button { padding: 6px 16px; cursor: pointer; }
    #summary { display: none; background: #f2f2f2; padding: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>Multi-Step Form</h2>
  <p id="progress"></p>

  <div id="formArea">
    <div class="step active">
      <label>Name</label>
      <input type="text" id="name" placeholder="Your name">
    </div>
    <div class="step">
      <label>Email</label>
      <input type="text" id="email" placeholder="you@example.com">
    </div>
    <div class="step">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 6 characters">
    </div>
    <div class="error" id="error"></div>
    <button id="backBtn">Back</button>
    <button id="nextBtn">Next</button>
  </div>

  <div id="summary"></div>
  <script src="q3.js"></script>
</body>
</html>
