<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q2 - Character Counter</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
    textarea { width: 100%; height: 120px; padding: 8px; box-sizing: border-box; }
    #counter { margin: 8px 0; font-weight: bold; color: green; }
    #counter.warning { color: #d4a900; }
    #counter.danger { color: red; }
  </style>
</head>
<body>
  <h2>Live Character Counter</h2>
  <textarea id="text" placeholder="Type something..."></textarea>
  <div id="counter">100 characters remaining</div>
  <button id="resetBtn">Reset</button>
  <script src="q2.js"></script>
</body>
</html>
