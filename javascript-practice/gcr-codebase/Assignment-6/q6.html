<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fake Store - Product Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; background: #f4f4f4; }
    h2 { text-align: center; }
    #message { color: #d93025; text-align: center; }
    #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .card { background: #fff; padding: 12px; border-radius: 6px; text-align: center; font-size: 13px; }
    .card img { height: 120px; max-width: 100%; object-fit: contain; }
    .card strong { color: #0a7a4b; }
  </style>
</head>
<body>
  <h2>Fake Store - Product Dashboard</h2>
  <p id="message"></p>
  <div id="products"></div>
  <script src="q6.js"></script>
</body>
</html>
