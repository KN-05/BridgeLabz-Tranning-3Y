<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>
    <h1>My Travel Selection</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>UAE</option>
        <option>United Kingdom</option>
        <option>USA</option>
    </select>
    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Goa</option>
        <option>Himachal Pradesh</option>
    </select>
    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
        <option>Manali</option>
    </select>
    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Delhi Gate</option>
        <option>Manali</option>
        <option>Jaipur City Palace</option>
    </select>
    <br><br>
    
    <p>
        My selected travel choices are India, Uttar Pradesh, Mathura,
        and my favorite tourist place is the Taj Mahal.
    </p>
</body>
</html>
