<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q9 - Outline and Focus Styling Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Outline and Focus Styling Form</h1>
  </header>

  <main>
    <form>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" class="outline-solid" placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="outline-dashed" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" class="outline-dotted" placeholder="Enter your phone number">
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="4" placeholder="Write your message here..."></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Khush Nagpal</p>
  </footer>
</body>
</html>
