<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q1 - Borders and Padding Demonstration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Borders and Padding Demonstration</h1>
  </header>

  <main>
    <section class="box-row">
      <!-- Each box demonstrates a different border style -->
      <div class="box solid">
        <p>Solid Border</p>
      </div>
      <div class="box dashed">
        <p>Dashed Border</p>
      </div>
      <div class="box double">
        <p>Double Border</p>
      </div>
      <div class="box groove">
        <p>Groove Border</p>
      </div>
    </section>

    <section class="box-row">
      <!-- Rounded corners with different border-radius values -->
      <div class="box rounded-sm">
        <p>Small Radius</p>
      </div>
      <div class="box rounded-md">
        <p>Medium Radius</p>
      </div>
      <div class="box rounded-full">
        <p>Full Radius</p>
      </div>
    </section>

    <section class="box-row">
      <!-- Different padding values to show internal spacing -->
      <div class="box padding-sm">
        <p>Padding 5px</p>
      </div>
      <div class="box padding-md">
        <p>Padding 20px</p>
      </div>
      <div class="box padding-lg">
        <p>Padding 40px</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Khush Nagpal</p>
  </footer>
</body>
</html>
