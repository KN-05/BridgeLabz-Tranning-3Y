<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tooltip Demonstration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>CSS-Only Tooltip Demonstration</h1>
    <p>Hover over each item below to see its tooltip fade in</p>
  </header>

  <main class="tooltip-area">

    <!-- Tooltip on an icon-like word -->
    <span class="tooltip-item">
      Home
      <span class="tooltip-box">Go back to the homepage</span>
    </span>

    <!-- Tooltip on another word -->
    <span class="tooltip-item">
      Settings
      <span class="tooltip-box">Adjust your preferences here</span>
    </span>

    <!-- Tooltip on another word -->
    <span class="tooltip-item">
      Profile
      <span class="tooltip-box">View and edit your profile</span>
    </span>

    <!-- Tooltip on another word -->
    <span class="tooltip-item">
      Help
      <span class="tooltip-box">Get support and answers</span>
    </span>

    <!-- Tooltip on another word -->
    <span class="tooltip-item">
      Logout
      <span class="tooltip-box">Sign out of your account</span>
    </span>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Tooltip Demo</p>
  </footer>
</body>
</html>
