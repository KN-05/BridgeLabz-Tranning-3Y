<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Image Showcase Gallery</h1>
    <p>Hover over an image to see it scale up and darken</p>
  </header>

  <main>
    <!-- Grid of 6 image showcase figures -->
    <section class="gallery">

      <figure class="gallery-item">
        <div class="img-wrap">
          <div class="placeholder-img img1"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>Mountain View</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="img-wrap">
          <div class="placeholder-img img2"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>Ocean Sunset</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="img-wrap">
          <div class="placeholder-img img3"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>City Lights</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="img-wrap">
          <div class="placeholder-img img4"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>Forest Trail</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="img-wrap">
          <div class="placeholder-img img5"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>Desert Dunes</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="img-wrap">
          <div class="placeholder-img img6"></div>
          <div class="overlay"></div>
        </div>
        <figcaption>Snowy Peaks</figcaption>
      </figure>

    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Image Showcase</p>
  </footer>
</body>
</html>
