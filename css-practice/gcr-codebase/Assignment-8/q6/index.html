<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Animation Demonstration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>CSS Animation Demonstration</h1>
    <p>Three animated elements using @keyframes</p>
  </header>

  <main class="animation-area">

    <!-- Moving box animation -->
    <div class="animation-block">
      <div class="moving-box"></div>
      <p class="explain">Moving box (slides left and right)</p>
    </div>

    <!-- Bouncing ball animation -->
    <div class="animation-block">
      <div class="bouncing-ball"></div>
      <p class="explain">Bouncing ball (vertical bounce)</p>
    </div>

    <!-- Color-changing text animation -->
    <div class="animation-block">
      <p class="color-text">Color Changing Text</p>
      <p class="explain">Text color cycles continuously</p>
    </div>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Animation Demo</p>
  </footer>
</body>
</html>
