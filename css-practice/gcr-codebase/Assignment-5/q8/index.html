<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q8 - Dashboard Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>My Dashboard</h1>
  </header>

  <div class="layout">

    <nav class="sidebar">
      <a href="#">Dashboard</a>
      <a href="#">Analytics</a>
      <a href="#">Projects</a>
      <a href="#">Messages</a>
      <a href="#">Settings</a>
    </nav>

    <main class="content">
      <section class="content-box">
        <h2>Overview</h2>
        <p>Here you can see a quick summary of your recent activity
        and performance statistics.</p>
      </section>

      <section class="content-box">
        <h2>Recent Activity</h2>
        <p>This box would normally list recent notifications, tasks,
        or updates related to your account.</p>
      </section>
    </main>

  </div>

</body>
</html>
