<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q6 - Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">Photo Gallery</h1>

  <main class="gallery">

    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1011/400/300" alt="Mountain landscape">
      <figcaption>Mountains</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1015/400/300" alt="River view">
      <figcaption>River</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1016/400/300" alt="Cliff and sea">
      <figcaption>Cliffside</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1018/400/300" alt="Forest lake">
      <figcaption>Forest Lake</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1024/400/300" alt="Desert dog">
      <figcaption>Desert Walk</figcaption>
    </figure>

    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1035/400/300" alt="Foggy forest road">
      <figcaption>Foggy Road</figcaption>
    </figure>

  </main>

</body>
</html>
