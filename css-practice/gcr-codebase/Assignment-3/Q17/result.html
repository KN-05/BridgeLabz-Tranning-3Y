<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>

<body>

    <h1>Student Form</h1>

    <form action="result.html" target="resultFrame">

        <label for="name">Enter Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <!-- Result page will be loaded inside this iframe after submitting -->
    <iframe
        name="resultFrame"
        width="600"
        height="200"
        title="Form Result">
    </iframe>

</body>

</html>
