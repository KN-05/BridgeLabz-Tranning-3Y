<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>File Upload Form</title>
</head>

<body>

    <h1>File Upload Form</h1>

    <form>

        <label for="image">Choose an Image:</label>

        <input
            type="file"
            id="image"
            name="image"
            accept=".jpg, .png"
            required>

        <p>Only JPG and PNG image files are allowed.</p>

        <br>

        <input type="submit" value="Upload">

    </form>

</body>

</html>
