<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Information</title>
</head>

<body>

    <h1>Student Information Form</h1>

    <form>

        <table>

            <tr>
                <td>
                    <label for="name">Name:</label>
                </td>
                <td>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="roll">Roll Number:</label>
                </td>
                <td>
                    <input
                        type="text"
                        id="roll"
                        name="roll"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="course">Course:</label>
                </td>
                <td>
                    <select id="course" name="course" required>

                        <option value="" disabled selected>
                            Select Course
                        </option>

                        <option value="B.Tech">
                            B.Tech
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="MCA">
                            MCA
                        </option>

                        <option value="BBA">
                            BBA
                        </option>

                    </select>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Submit">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
