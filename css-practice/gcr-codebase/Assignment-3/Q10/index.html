<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>

<body>

    <h1>Contact Form</h1>

    <form>

        <table>
            <tr>
                <td>
                    <label for="fullname">Full Name:</label>
                </td>
                <td>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Email:</label>
                </td>
                <td>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="subject">Subject:</label>
                </td>
                <td>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter subject"
                        required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="message">Message:</label>
                </td>
                <td>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        cols="40"
                        placeholder="Write your message here..."
                        required></textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Send Message">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
