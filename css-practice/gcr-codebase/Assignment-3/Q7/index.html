<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>

<body>

    <h1>Login Form</h1>

    <form method="post" action="#">

        <table>

            <tr>
                <td>
                    <label for="username">Username:</label>
                </td>
                <td>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="password">Password:</label>
                </td>
                <td>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required>
                </td>
            </tr>
            <input
                type="hidden"
                name="csrf_token"
                value="dummy-csrf-token-12345">

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Login">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
