<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Flip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-container">
  <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="https://picsum.photos/250/150" alt="Card front">
        <h2>Card Title</h2>
      </div>
      <div class="card-back">
        <p>This is the back of the card with a short description of the content shown on the front.</p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
