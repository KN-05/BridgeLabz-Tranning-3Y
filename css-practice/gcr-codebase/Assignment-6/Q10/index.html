<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Layout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="logo">MyLogo</div>
  <nav class="nav-links">
    <a href="#">Home</a>
    <a href="#">Articles</a>
    <a href="#">Contact</a>
  </nav>
</header>

<main class="main-grid">
  <article class="article">
    <h1 class="fade-title">Featured Article</h1>
    <p>An introduction to the main article content, giving readers context before they dive in further.</p>

    <div class="flex-boxes">
      <div class="box">Point 1</div>
      <div class="box">Point 2</div>
      <div class="box">Point 3</div>
    </div>
  </article>

  <aside class="sidebar">
    <h2>Sidebar</h2>
    <p>Related links and extra information appear here.</p>
  </aside>
</main>

<footer class="site-footer">
  <p>&copy; 2026 MyLogo. All rights reserved.</p>
</footer>

</body>
</html>
