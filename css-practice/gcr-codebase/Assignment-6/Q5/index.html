<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="pricing-section">
  <div class="pricing-card">
    <h2>Basic</h2>
    <p class="price">$9/mo</p>
    <p>Good for individuals getting started.</p>
  </div>

  <div class="pricing-card featured">
    <h2>Pro</h2>
    <p class="price">$29/mo</p>
    <p>Best for growing teams and projects.</p>
  </div>

  <div class="pricing-card">
    <h2>Enterprise</h2>
    <p class="price">$79/mo</p>
    <p>For large organizations at scale.</p>
  </div>
</main>

</body>
</html>
